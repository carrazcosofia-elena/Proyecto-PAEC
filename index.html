<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title> 🧡Proyecto PAEC </title>
    <style>
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f8f9fa;
            padding: 10px 20px;
        }

        /* Estilo para controlar el tamaño fijo del logotipo pequeño */
        .logo-pequeno {
            width: 50px;
            /* Ajusta el tamaño que desees */
            height: auto;
            display: block;
        }

        /* Estilo para que la imagen de la cabecera sea responsiva y no se desborde */


        .logo-cabecera {
            max-width: 100%;
            height: auto;
            display: block;
            margin-bottom: 15px;
            /* Espacio entre la imagen y el título */
        }

        main {
            display: flex;
            gap: 20px;

        }

        aside {
            width: 25%;

            background-color: #f0f0f0;
            padding: 15px;
        }


        section {
            width: 75%;
            background-color: #e0f7fa;
            padding: 15px;
        }
    </style>
</head>

<body>
    <header>
        <div>
            <h1 style="margin: 0;">🧡Proyecto PAEC</h1>
            <nav>Menú de navegación</nav>
        </div>
        <img src="imagenes/image-removebg-preview.png" alt="Logo de Mi Sitio Web" class="logo-cabecera">
    </header>
    <main>
        <aside>
            <h3>Barra Lateral</h3>
            <p>Enlaces, publicidad o categorías.</p>
        </aside>
        <section>
            <article>
                <h2>Artículo Principal</h2>
                <p>Contenido del artículo...</p>
            </article>
        </section>
    </main>

    <footer>
        <p>Pie de página</p>
    </footer>

</body>

</html>
